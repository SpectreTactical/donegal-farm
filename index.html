<!DOCTYPE html>
<html lang="en-ZA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<meta name="referrer" content="no-referrer">
<title>Donegal Farm – Herd Tracker</title>
<style>
:root{--g:#2f5d3a;--g2:#e7f0e8;--bd:#d5dbd3;--tx:#1d2420;--mut:#5f6b63;--bg:#f6f7f4;--warn:#8a5a00;--wbg:#fff4d6;--red:#a3261b;--bull:#3b6ea8;--heif:#c0607e}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--tx);background:var(--bg)}
.top{position:sticky;top:0;z-index:5;background:var(--g);color:#fff;display:flex;flex-wrap:wrap;align-items:center;gap:4px 16px;padding:6px 12px}
.brand{display:flex;align-items:center;gap:8px}.brand small{display:block;opacity:.8;font-size:12px}.logo{font-size:24px}
.tabs{display:flex;gap:2px;overflow-x:auto;flex:1;min-width:0;scrollbar-width:none}
.tabs button{background:transparent;border:0;color:#fff;opacity:.8;padding:9px 11px;font:inherit;border-radius:6px;white-space:nowrap;cursor:pointer}
.tabs button.on{background:rgba(255,255,255,.18);opacity:1;font-weight:600}
main{max-width:1150px;margin:0 auto;padding:12px}
#banners{max-width:1150px;margin:0 auto;padding:0 12px}
.banner{margin-top:10px;padding:9px 12px;border-radius:8px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.banner.ex{background:#e8eefb;border:1px solid #b9c8ea}.banner.bk{background:var(--wbg);border:1px solid #e6cf8f}
h2{font-size:19px;margin:6px 0 10px}h3{font-size:16px;margin:16px 0 8px}
.card{background:#fff;border:1px solid var(--bd);border-radius:10px;padding:12px;margin-bottom:12px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.sp{flex:1}
button,.btn{font:inherit;border:1px solid var(--bd);background:#fff;color:var(--tx);padding:8px 13px;border-radius:7px;cursor:pointer;min-height:38px}
button.pri{background:var(--g);border-color:var(--g);color:#fff}button.danger{background:var(--red);border-color:var(--red);color:#fff}
button.link{border:0;background:none;color:var(--g);text-decoration:underline;padding:4px;min-height:0}
button:disabled{opacity:.5;cursor:default}
input,select,textarea{font:inherit;font-size:16px;padding:7px 8px;border:1px solid #b9c2ba;border-radius:6px;background:#fff;color:var(--tx);width:100%;min-height:38px}
textarea{min-height:60px}
label.f{display:block;margin-bottom:8px}label.f>span{display:block;font-size:13px;color:var(--mut);margin-bottom:2px}
label.chk{display:flex;gap:8px;align-items:center}label.chk input{width:auto;min-height:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:0 10px}
.grid .wide{grid-column:1/-1}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.stat{background:#fff;border:1px solid var(--bd);border-radius:9px;padding:9px 10px}
.stat b{display:block;font-size:20px}.stat span{font-size:12px;color:var(--mut)}.stat small{display:block;color:var(--mut);font-size:12px}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--bd);border-radius:8px;background:#fff}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:6px 8px;border-bottom:1px solid #e8ebe6;text-align:left;white-space:nowrap}
th{background:var(--g2);font-weight:600;position:sticky;top:0}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
tr.click{cursor:pointer}tr.click:hover{background:#f3f7f2}
tfoot td{font-weight:600;background:#fafbf9}
td.wrap{white-space:normal;min-width:140px}
.kvt td{white-space:normal}.kvt td.n{white-space:nowrap}
.tag{display:inline-block;font-size:11px;padding:1px 6px;border-radius:9px;background:#e8eefb;color:#2c4a8a;margin-left:4px;font-weight:600;letter-spacing:.3px}
.tag.d{background:#fde4e1;color:var(--red)}.tag.s{background:#e3f1e5;color:var(--g)}
.muted{color:var(--mut)}.small{font-size:13px}
.warns{background:var(--wbg);border:1px solid #e6cf8f;color:var(--warn);border-radius:7px;padding:7px 10px;margin:6px 0;font-size:14px}
.warns:empty{display:none}
.calcbox{background:var(--g2);border-radius:8px;padding:8px 10px;margin:6px 0;font-size:14px}
.calcbox td{padding:2px 6px;border:0}
.charts{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:10px}
.chart{background:#fff;border:1px solid var(--bd);border-radius:9px;padding:8px}
.chart svg{width:100%;height:auto;display:block}
.legend{font-size:12px;color:var(--mut)}.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin:0 4px 0 8px;vertical-align:-1px}
.ov{position:fixed;inset:0;background:rgba(20,30,22,.45);display:flex;align-items:flex-start;justify-content:center;padding:4vh 10px;z-index:50;overflow-y:auto}
.dlg{background:#fff;border-radius:12px;max-width:620px;width:100%;box-shadow:0 10px 40px rgba(0,0,0,.3);display:flex;flex-direction:column;max-height:92vh}
.dlg.wide{max-width:860px}
.dlg h3{margin:0;padding:12px 14px;border-bottom:1px solid #e8ebe6}
.dlg .bd{padding:12px 14px;overflow-y:auto}
.dlg .ft{padding:10px 14px;border-top:1px solid #e8ebe6;display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end}
.dlg .ft .left{margin-right:auto}
.picklist{max-height:300px;overflow-y:auto;border:1px solid var(--bd);border-radius:7px}
.picklist label{display:flex;gap:8px;align-items:center;padding:6px 8px;border-bottom:1px solid #eef0ec}
.picklist input[type=checkbox]{width:auto;min-height:0}
.picklist input[type=number]{width:90px;margin-left:auto}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#233;color:#fff;padding:9px 16px;border-radius:20px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:60}
#toast.on{opacity:.95}
#print{display:none}
@media (max-width:600px){
  main{padding:8px}.top{padding:6px 8px}.brand small{display:none}.tabs{flex-basis:100%}
  .dlg{max-height:none;border-radius:10px}.ov{padding:8px 6px}
  .stat b{font-size:18px}.stats{grid-template-columns:repeat(2,1fr)}
  .charts{grid-template-columns:1fr}
  .grid{grid-template-columns:1fr 1fr}
}
@page{size:A4;margin:12mm}
@media print{
  body{background:#fff;font-size:11pt}
  body>*:not(#print){display:none!important}
  #print{display:block!important}
  .rep h1{font-size:17pt;margin:0 0 2mm}.rep h2{font-size:13pt;margin:6mm 0 2mm;border-bottom:1px solid #999}
  .rep table{font-size:9.5pt;width:100%;border-collapse:collapse}
  .rep th,.rep td{border:1px solid #bbb;padding:1.2mm 2mm;white-space:normal;position:static}
  .rep th{background:#eee!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .rep tr{break-inside:avoid}
  .rep .sum{display:grid;grid-template-columns:1fr 1fr;gap:0 8mm}
  .rep .chart{border:0;padding:0;break-inside:avoid}
  .rep .charts{display:grid;grid-template-columns:1fr 1fr;gap:4mm}
  .rep .foot{margin-top:6mm;font-size:8.5pt;color:#555}
}
@media screen{
  #print.on{display:block;position:fixed;inset:0;z-index:40;background:#7a817c;overflow:auto;padding:10px}
  #print .pbar{position:sticky;top:0;display:flex;gap:8px;justify-content:center;padding:6px;margin-bottom:10px}
  #print .page{background:#fff;width:210mm;max-width:100%;min-height:297mm;margin:0 auto;padding:12mm;box-shadow:0 2px 12px rgba(0,0,0,.4)}
  .rep h1{font-size:22px;margin:0 0 4px}.rep h2{font-size:16px;margin:16px 0 6px;border-bottom:1px solid #999}
  .rep table{font-size:13px}.rep th,.rep td{border:1px solid #ccc;white-space:normal;position:static}
  .rep .sum{display:grid;grid-template-columns:1fr 1fr;gap:0 20px}
  .rep .charts{display:grid;grid-template-columns:1fr 1fr;gap:8px}.rep .chart{border:0;padding:0}
  .rep .foot{margin-top:16px;font-size:12px;color:#555}
}
@media screen and (max-width:600px){#print .page{padding:5mm;overflow-x:auto}.rep .sum,.rep .charts{grid-template-columns:1fr}}
@media print{#print .pbar{display:none}#print .page{padding:0}}
.syncchip{background:rgba(255,255,255,.15);border:0;color:#fff;font-size:12px;padding:4px 10px;min-height:28px;border-radius:14px;white-space:nowrap}
.syncchip[data-st=online]{color:#c9f5cf}.syncchip[data-st=offline]{color:#ffd88a}.syncchip[data-st=error]{color:#ffb4a8}
body.signedout .top .tabs,body.signedout .syncchip,body.signedout #banners,body.signedout main{display:none}
#auth[hidden]{display:none}
.authbox{max-width:420px;margin:24px auto;background:#fff;border:1px solid var(--bd);border-radius:12px;padding:18px}
.authbox h2{margin-top:14px}.authbox form button[type=submit]{width:100%;margin-top:4px}
.brand.big .logo{font-size:34px}.brand.big b{font-size:20px}.brand.big small{display:block;color:var(--mut)}
@media (max-width:600px){.syncchip{margin-left:auto}.authbox{margin:10px 4px}}

/* market tab */
.mkstats{grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}.mkstats .stat b{font-size:24px}
.mkd.up{color:#2f7a3a}.mkd.dn{color:var(--red)}td.mkup{color:#2f7a3a}td.mkdn{color:var(--red)}
.mkcav ul{margin:4px 0 0;padding-left:20px}.mkcav li{margin:2px 0}
.mkgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.mksrc p{margin:6px 0}
.mkchart svg{max-height:340px}
@media (max-width:600px){.mkgrid{grid-template-columns:1fr}.mkstats{grid-template-columns:1fr}}

<script>
/* Donegal Farm – pure calculation helpers (also loaded by node tests) */
(function (root) {
  'use strict';
  function num(v) {
    if (v === '' || v === null || v === undefined) return null;
    var n = typeof v === 'number' ? v : parseFloat(String(v).replace(/\s/g, '').replace(',', '.'));
    return isFinite(n) ? n : null;
  }
  function near(a, b) { return Math.abs(a - b) <= Math.max(1, Math.abs(b) * 0.005); }

  /* Sale: works out whichever values can be derived from the ones entered.
     Inputs (any may be blank): head, kg, pkg (R/kg), phead (R/head), gross,
     commPct, comm (R), levies, transport, other, net. */
  function calcSale(s) {
    s = s || {};
    var head = num(s.head), kg = num(s.kg), pkg = num(s.pkg), ph = num(s.phead);
    var gross = num(s.gross), net = num(s.net), pct = num(s.commPct), comm = num(s.comm);
    var fixed = ['levies', 'transport', 'other'].reduce(function (a, k) { return a + (num(s[k]) || 0); }, 0);
    var derived = {}, warn = [];
    var grossIn = gross, pkgIn = pkg, phIn = ph, netIn = net, commIn = comm;
    if (gross === null) {
      if (kg !== null && pkg !== null) { gross = kg * pkg; derived.gross = 'kg × R/kg'; }
      else if (head !== null && ph !== null) { gross = head * ph; derived.gross = 'head × R/head'; }
    }
    if (gross === null && net !== null) {
      if (comm === null && pct !== null) {
        if (pct < 100) { gross = (net + fixed) / (1 - pct / 100); derived.gross = 'net + deductions'; }
      } else { gross = net + fixed + (comm || 0); derived.gross = 'net + deductions'; }
    }
    if (comm === null && pct !== null && gross !== null) { comm = gross * pct / 100; derived.comm = pct + '% of gross'; }
    if (commIn !== null && pct !== null && gross !== null && !near(commIn, gross * pct / 100))
      warn.push('Commission R' + commIn.toFixed(2) + ' is not ' + pct + '% of gross – the rand amount is used.');
    var ded = fixed + (comm || 0);
    if (gross !== null) {
      if (pkg === null && kg) { pkg = gross / kg; derived.pkg = 'gross ÷ kg'; }
      if (ph === null && head) { ph = gross / head; derived.phead = 'gross ÷ head'; }
      if (net === null) { net = gross - ded; derived.net = 'gross − deductions'; }
      else if (!near(net, gross - ded)) warn.push('Net entered differs from gross − deductions (' + (gross - ded).toFixed(2) + ').');
    }
    if (grossIn !== null && kg !== null && pkgIn !== null && !near(kg * pkgIn, grossIn))
      warn.push('kg × R/kg (' + (kg * pkgIn).toFixed(2) + ') differs from gross entered.');
    if (grossIn !== null && head !== null && phIn !== null && !near(head * phIn, grossIn))
      warn.push('head × R/head (' + (head * phIn).toFixed(2) + ') differs from gross entered.');
    if (grossIn === null && kg !== null && pkgIn !== null && head !== null && phIn !== null && !near(kg * pkgIn, head * phIn))
      warn.push('kg × R/kg and head × R/head give different totals – kg × R/kg is used.');
    if (gross === null) warn.push('Not enough figures to work out the gross amount yet.');
    if (net !== null && net < 0) warn.push('Net amount is negative.');
    if (pkg !== null && (pkg < 5 || pkg > 200)) warn.push('R/kg of ' + pkg.toFixed(2) + ' looks unusual – please check.');
    return { head: head, kg: kg, pkg: pkg, phead: ph, gross: gross, comm: comm, commPct: pct, fixed: fixed,
      ded: gross === null && net === null ? null : ded, net: net, avgKg: kg && head ? kg / head : null,
      derived: derived, warn: warn, netIn: netIn };
  }

  function addDays(iso, n) {
    var d = new Date(iso + 'T12:00:00Z'); d.setUTCDate(d.getUTCDate() + n);
    return d.toISOString().slice(0, 10);
  }
  function yearOf(iso) { return iso ? +String(iso).slice(0, 4) : null; }

  function seasonList(D, mode) {
    if (mode === 'named' && D.seasons && D.seasons.length) {
      return D.seasons.slice().sort(function (a, b) { return a.start < b.start ? -1 : 1; }).map(function (s) {
        return { key: s.id, name: s.name, start: s.start, end: s.end, cowsBred: num(s.cowsBred), named: true };
      });
    }
    var ys = {}; ys[new Date().getFullYear()] = 1;
    function add(d) { var y = yearOf(d); if (y) ys[y] = 1; }
    (D.calves || []).forEach(function (c) { add(c.born); });
    (D.batches || []).forEach(function (b) { add(b.date); add(b.bornApprox); });
    (D.sales || []).forEach(function (s) { add(s.date); });
    (D.moves || []).forEach(function (m) { add(m.date); });
    var yc = (D.settings && D.settings.yearCows) || {};
    return Object.keys(ys).map(Number).sort().map(function (y) {
      return { key: 'y' + y, name: String(y), start: y + '-01-01', end: y + '-12-31', cowsBred: num(yc[y]), named: false };
    });
  }

  /* Season statistics. Calf cohort = calves born in the season; weaning counts belong to the
     cohort (individual calves by birth date, batch entries by "calves born around" date).
     Sales and movements count by their own date. */
  function seasonStats(D, se) {
    function inR(d) { return !!d && d >= se.start && d <= se.end; }
    var calves = (D.calves || []).filter(function (c) { return inR(c.born); });
    var st = { born: calves.length, bulls: 0, heifers: 0, unknownSex: 0, alive: 0, died: 0, stillborn: 0 };
    var wN = 0, wtSum = 0, wtN = 0, bwSum = 0, bwN = 0;
    calves.forEach(function (c) {
      if (c.sex === 'bull') st.bulls++; else if (c.sex === 'heifer') st.heifers++; else st.unknownSex++;
      if (c.status === 'died') st.died++; else if (c.status === 'stillborn') st.stillborn++; else st.alive++;
      if (num(c.bw) !== null) { bwSum += num(c.bw); bwN++; }
      if (c.wDate) { wN++; if (num(c.wWt) !== null) { wtSum += num(c.wWt); wtN++; } }
    });
    var batches = (D.batches || []).filter(function (b) { return inR(b.bornApprox || b.date); });
    batches.forEach(function (b) {
      var n = num(b.count) || 0; wN += n;
      if (num(b.avgWt) !== null && n) { wtSum += num(b.avgWt) * n; wtN += n; }
    });
    st.weanedInd = wN - batches.reduce(function (a, b) { return a + (num(b.count) || 0); }, 0);
    st.weaned = wN;
    st.weanRate = st.born ? wN / st.born : null;
    st.avgWean = wtN ? wtSum / wtN : null;
    st.avgBw = bwN ? bwSum / bwN : null;
    st.losses = st.died + st.stillborn;
    st.cowsBred = se.cowsBred === undefined ? null : se.cowsBred;
    st.calvingRate = st.cowsBred ? st.born / st.cowsBred : null;
    st.weanPerCow = st.cowsBred ? wN / st.cowsBred : null;
    var sales = (D.sales || []).filter(function (s) { return inR(s.date); });
    var t = { head: 0, kg: 0, gross: 0, ded: 0, net: 0, grossKg: 0, kgN: 0, grossHead: 0, headN: 0 }, byClass = {};
    sales.forEach(function (s) {
      var c = calcSale(s);
      var h = c.head || 0, g = c.gross || 0;
      t.head += h; t.gross += g; t.ded += c.ded || 0; t.net += c.net || 0;
      if (c.kg) { t.kg += c.kg; if (c.gross !== null) { t.grossKg += g; t.kgN += c.kg; } }
      if (h && c.gross !== null) { t.grossHead += g; t.headN += h; }
      var k = s.cls || 'Unspecified';
      var bc = byClass[k] || (byClass[k] = { head: 0, kg: 0, gross: 0, net: 0, kgN: 0, grossKg: 0 });
      bc.head += h; bc.gross += g; bc.net += c.net || 0;
      if (c.kg) { bc.kg += c.kg; if (c.gross !== null) { bc.kgN += c.kg; bc.grossKg += g; } }
    });
    Object.keys(byClass).forEach(function (k) {
      var b = byClass[k]; b.rkg = b.kgN ? b.grossKg / b.kgN : null; b.rhead = b.head ? b.gross / b.head : null;
    });
    st.sales = sales.length; st.headSold = t.head; st.kgSold = t.kg; st.gross = t.gross; st.ded = t.ded; st.net = t.net;
    st.rkg = t.kgN ? t.grossKg / t.kgN : null; st.rhead = t.headN ? t.grossHead / t.headN : null;
    st.byClass = byClass;
    var mv = { purchHead: 0, purchR: 0, deaths: 0, otherIn: 0, otherOut: 0 };
    (D.moves || []).filter(function (m) { return inR(m.date); }).forEach(function (m) {
      var h = num(m.head) || 0;
      if (m.type === 'purchase') { mv.purchHead += h; mv.purchR += num(m.amount) || 0; }
      else if (m.type === 'death') mv.deaths += h;
      else if (m.type === 'in') mv.otherIn += h;
      else mv.otherOut += h;
    });
    st.moves = mv;
    return st;
  }

  /* Herd estimate from an opening count: + calves born alive, − calves that died,
     + purchases/other in, − sold, − adult deaths/other out (all after the opening date). */
  function herdEstimate(D) {
    var o = D.settings && D.settings.opening;
    if (!o || num(o.count) === null || !o.date) return null;
    var after = function (d) { return d && d > o.date; };
    var r = { opening: num(o.count), date: o.date, bornAlive: 0, calfDeaths: 0, purchased: 0, otherIn: 0, sold: 0, deaths: 0, otherOut: 0 };
    (D.calves || []).forEach(function (c) {
      if (!after(c.born) || c.status === 'stillborn') return;
      r.bornAlive++; if (c.status === 'died') r.calfDeaths++;
    });
    (D.sales || []).forEach(function (s) { if (after(s.date)) r.sold += num(s.head) || 0; });
    (D.moves || []).forEach(function (m) {
      if (!after(m.date)) return; var h = num(m.head) || 0;
      if (m.type === 'purchase') r.purchased += h; else if (m.type === 'death') r.deaths += h;
      else if (m.type === 'in') r.otherIn += h; else r.otherOut += h;
    });
    r.total = r.opening + r.bornAlive - r.calfDeaths + r.purchased + r.otherIn - r.sold - r.deaths - r.otherOut;
    return r;
  }

  }
  labels.forEach(function (lab, i) {

    series.forEach(function (s) {

      if (h > 0) g += '<rect x="' + x.toFixed(1) + '" y="' + (y0 - h).toFixed(1) + '" width="' + bw.toFixed(1) + '" height="' + h.toFixed(1) + '" fill="' + s.color + '"><title>' + esc(lab + ' ' + s.name + ': ' + fmt(s.vals[i])) + '</title></rect>';

    g += '<text x="' + (x + bw / 2).toFixed(1) + '" y="' + (H - B + 14) + '" font-size="10.5" text-anchor="middle" fill="#1d2420">' + esc(lab.length > 14 ? lab.slice(0, 13) + '…' : lab) + '</text>';

    '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + esc(title) + '">' + g + '<line x1="' + L + '" x2="' + (W - 4) + '" y1="' + (H - B) + '" y2="' + (H - B) + '" stroke="#888"/></svg></div>';

var MK = { feed: null, fetchedAt: null, loading: false, err: '', lastTry: 0 };

}
function safeUrl(u) { return /^https:\/\/[^\s"'<>]+$/.test(u || '') ? u : ''; }
function fetchPrices(manual) {

    .then(function (r) { if (!r.ok) throw new Error('The price feed answered ' + r.status + '.'); return r.json(); })

}
function lineChart(title, series, from, opts) {

  var pts = []; series.forEach(function (s) { s.pts = s.pts.filter(function (p) { return p.x >= from && p.y !== null && isFinite(p.y); }); pts = pts.concat(s.pts); });
  if (!pts.length) return '<div class="chart"><b class="small">' + esc(title) + '</b><p class="muted small">No prices in this period.</p></div>';
  function t(d) { return Date.parse(d + 'T12:00:00Z'); }
  var x0 = t(from), x1 = t(today()); pts.forEach(function (p) { x1 = Math.max(x1, t(p.x)); });
  var ys = pts.map(function (p) { return p.y; }), lo = Math.min.apply(null, ys), hi = Math.max.apply(null, ys);
  var pad = Math.max(0.5, (hi - lo) * 0.08), stepY = [1, 2, 5, 10, 20].filter(function (z) { return (hi - lo + 2 * pad) / z <= 5; })[0] || 50;
  lo = Math.floor((lo - pad) / stepY) * stepY; hi = Math.ceil((hi + pad) / stepY) * stepY;
  function X(d) { return L + (W - L - R) * (t(d) - x0) / Math.max(1, x1 - x0); }
  function Y(v) { return T + (H - T - Bm) * (1 - (v - lo) / Math.max(1, hi - lo)); }
  var g = '';
  for (var v = lo; v <= hi + 1e-9; v += stepY) { var yy = Y(v); g += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + yy.toFixed(1) + '" y2="' + yy.toFixed(1) + '" stroke="#e3e6e1"/><text x="' + (L - 4) + '" y="' + (yy + 4).toFixed(1) + '" font-size="' + fs + '" text-anchor="end" fill="#5f6b63">' + v.toFixed(0) + '</text>'; }
  /* month ticks (every 1, 2, 3 or 6 months depending on the span) */
  var span = (x1 - x0) / 864e5 * (narrow ? 1.8 : 1), step = span > 900 ? 6 : span > 400 ? 3 : span > 200 ? 2 : 1, d = new Date(x0), mo = new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth() + 1, 1));
  var MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  while (mo.getTime() <= x1) {
    if (mo.getUTCMonth() % step === 0) { var xi = L + (W - L - R) * (mo.getTime() - x0) / Math.max(1, x1 - x0); g += '<line x1="' + xi.toFixed(1) + '" x2="' + xi.toFixed(1) + '" y1="' + (H - Bm) + '" y2="' + (H - Bm + 4) + '" stroke="#888"/><text x="' + xi.toFixed(1) + '" y="' + (H - Bm + 16) + '" font-size="' + fs + '" text-anchor="middle" fill="#5f6b63">' + MON[mo.getUTCMonth()] + (mo.getUTCMonth() < step ? " '" + String(mo.getUTCFullYear()).slice(2) : '') + '</text>'; }
    mo = new Date(Date.UTC(mo.getUTCFullYear(), mo.getUTCMonth() + 1, 1));
  }
  series.forEach(function (s) {
    if (!s.pts.length) return;
    if (s.line !== false && s.pts.length > 1) g += '<polyline fill="none" stroke="' + s.color + '" stroke-width="' + (s.width || 2) + '"' + (s.dash ? ' stroke-dasharray="' + s.dash + '"' : '') + ' points="' + s.pts.map(function (p) { return X(p.x).toFixed(1) + ',' + Y(p.y).toFixed(1); }).join(' ') + '"/>';
    if (s.dots || s.pts.length === 1) s.pts.forEach(function (p) { g += '<circle cx="' + X(p.x).toFixed(1) + '" cy="' + Y(p.y).toFixed(1) + '" r="' + (s.r || 3.5) + '" fill="' + s.color + '"' + (s.ring ? ' stroke="#fff" stroke-width="1.5"' : '') + '><title>' + esc(fD(p.x) + ' – ' + s.name + ': ' + fR(p.y) + '/kg' + (p.note ? ' (' + p.note + ')' : '')) + '</title></circle>'; });
  });

function backupData() {
  var out = { seasons: [], cows: [], calves: [], batches: [], sales: [], moves: [] };
  KEYS.forEach(function (k) { out[k] = D[k].filter(function (x) { return !x.ex; }).map(clone); });
  out.settings = { seasonMode: D.settings.seasonMode, classes: D.settings.classes, yearCows: D.settings.yearCows, opening: D.settings.opening };
  return out;
}
function exportJSON() {
  var now = new Date().toISOString();
  U.lastBackup = now; saveUI(); rebuild();
  download('donegal-farm-backup-' + today() + '.json', JSON.stringify({ app: 'donegal-farm', v: 2, version: APP_VERSION, exported: now, exportedBy: who().name, data: backupData() }, null, 1), 'application/json');
  render(); toast('Backup downloaded');
}
function parseBackup(text) {
  var j = JSON.parse(text), d = j && j.data ? j.data : j;
  if (!d || typeof d !== 'object' || !KEYS.some(function (k) { return Array.isArray(d[k]); })) throw new Error('This file is not a Donegal Farm backup.');
  return normalize(d);
}
function counts(d) { return d.calves.length + ' calves, ' + d.batches.length + ' batch weanings, ' + d.sales.length + ' sales, ' + d.cows.length + ' cows, ' + d.moves.length + ' movements, ' + d.seasons.length + ' seasons'; }
function importText(text) {
  var nd;
  try { nd = parseBackup(text); } catch (e) { info('Import failed', '<p>' + esc(e.message) + '</p><p class="small muted">Nothing was changed.</p>'); return; }
  uploadDialog(nd, 'the backup file (' + counts(nd) + ')', false);
}
function importFile(file) {
  var r = new FileReader();
  r.onload = function () { importText(String(r.result)); };
  r.onerror = function () { info('Import failed', '<p>Could not read the file.</p>'); };
  r.readAsText(file);
}
function metaCols(x) { return x.ex ? ['', '', ''] : [x.createdBy ? x.createdBy.name : '', x.updatedBy ? x.updatedBy.name : '', x.updatedAt ? fTime(x.updatedAt) : '']; }
function csvForMeta(kind) {
  var rows = csvFor(kind), key = { calves: 'calves', batches: 'batches', sales: 'sales', moves: 'moves', cows: 'cows' }[kind];
  if (!key) return rows;
  rows[0] = rows[0].concat(['Entered by', 'Last changed by', 'Last changed']);
  D[key].forEach(function (x, i) { rows[i + 1] = rows[i + 1].concat(metaCols(x)); });
  return rows;
}
function clearAll() {
  if (!isAdmin()) return;
  var n = realCount();
  dlg({ title: 'Delete ALL farm records?', html: '<p>This deletes <b>every</b> calf, weaning, sale, cow, movement and season in the shared farm database (' + n + ' records) – for <b>everyone</b>, on every phone.</p><p><b>Back up first!</b> ' + backupLine() + '</p>',
    buttons: [{ t: 'Cancel', v: null }, { t: 'Export backup first', v: null, act: function () { exportJSON(); return false; } }, { t: 'Continue', v: 'go', cls: 'danger' }] }).then(function (go) {
    if (go !== 'go') return;
    dlg({ title: 'Type CLEAR to confirm', html: '<p>Type <b>CLEAR</b> to delete all ' + n + ' farm records for everyone. This cannot be undone.</p><input id="clrT" autocomplete="off" autocapitalize="characters"><div class="warns"></div>',
      buttons: [{ t: 'Cancel', v: null }, { t: 'Delete everything', cls: 'danger', act: function (root) {
        if ($('#clrT', root).value.trim().toUpperCase() !== 'CLEAR') { setWarn(root, ['Type CLEAR exactly.']); return false; }
        var ops = []; KEYS.forEach(function (k) { Object.keys(CLOUD[k]).forEach(function (id) { ops.push({ k: k, id: id, del: true }); }); });
        putMany(ops); toast('All farm records deleted');
      } }] });
  });
}
function rData(m) {
  var adm = isAdmin();
  var h = '<h2>Data &amp; backup</h2><div class="card"><b>Backup</b><p class="small">' + backupLine() + ' The records live in the shared farm database (and an offline copy on each signed-in phone). A JSON backup is still worth keeping somewhere safe. Backups hold farm records and the names of who entered them – never email addresses.</p><div class="row"><button id="xJson" class="pri">Export backup (JSON)</button>' +
    (adm ? '<label class="btn">Upload from backup file…<input id="iJson" type="file" accept=".json,application/json" style="display:none"></label>' : '') + '</div>' +
    (adm ? '<p class="small muted">Uploading adds records that are not in the database yet (matched by id); existing records and example data are skipped.</p>' : '<p class="small muted">Only admins can upload a backup into the farm database.</p>') + '</div>';
  if (adm) { var v1 = localV1(); if (v1) h += '<div class="card"><b>Earlier local-only version</b><p class="small">This device still has data from v1 (' + counts(v1) + ', including any example rows).</p><button id="xMig">Upload new records to farm database</button></div>'; }
  h += '<div class="card"><b>Export to spreadsheet (CSV)</b><div class="row" style="margin-top:6px"><select id="csvK" style="width:auto"><option value="summary">Season summary</option><option value="calves">Calves</option><option value="batches">Batch weanings</option><option value="sales">Sales</option><option value="moves">Movements</option><option value="cows">Animals (register)</option></select><button id="xCsv">Download CSV</button></div></div>';
  if (hasExample()) h += '<div class="card"><b>Example data</b><p class="small">Made-up records marked EXAMPLE, shown only while the farm database is empty. They are never saved.</p><button id="dRemEx">Remove example data</button></div>';
  h += '<div class="card"><b>Privacy</b><p class="small">No ID numbers or cell numbers are stored – the app (and the database rules) refuse them. Buyer is a name only and optional. Only approved family members can open the farm database.</p></div>';
  if (adm) h += '<div class="card"><b>Danger zone</b><p class="small">Deletes all farm records in the shared database for everyone. Members are not affected.</p><button id="dClr" class="danger">Delete all farm records…</button></div>';
  h += '<p class="small muted">Donegal Farm – Herd Tracker ' + APP_VERSION + '</p>';
  m.innerHTML = h;
  $('#xJson').onclick = exportJSON;
  if ($('#iJson')) $('#iJson').onchange = function () { if (this.files[0]) importFile(this.files[0]); this.value = ''; };
  if ($('#xMig')) $('#xMig').onclick = function () { uploadDialog(localV1(), 'the earlier local-only version on this device', true); };
  $('#xCsv').onclick = function () { var k = $('#csvK').value; download('donegal-farm-' + k + '-' + today() + '.csv', C.csv(csvForMeta(k)), 'text/csv'); toast('CSV downloaded'); };
  if ($('#dRemEx')) $('#dRemEx').onclick = removeExample;
  if ($('#dClr')) $('#dClr').onclick = clearAll;
}

/* ---------- members (admins only; the only place email addresses are shown) ---------- */
var APP = { screen: 'loading', members: null, stopMembers: null, msg: '' };
function rMembers(m) {
  if (!isAdmin()) { m.innerHTML = ''; return; }
  var list = APP.members;
  if (!list) { m.innerHTML = '<h2>Members</h2><p class="muted">Loading…</p>'; return; }
  var pend = list.filter(function (x) { return !x.approved; }), mem = list.filter(function (x) { return x.approved; }).sort(function (a, b) { return String(a.name).localeCompare(String(b.name)); });
  var h = '<h2>Members</h2><p class="small muted">Only approved members can see or change farm records. Email addresses are shown only here, to admins.</p>';
  h += '<h3>Waiting for approval (' + pend.length + ')</h3><div class="tw"><table><thead><tr><th>Name</th><th>Email</th><th>Requested</th><th></th></tr></thead><tbody>' +
    (pend.length ? pend.map(function (x) { return '<tr data-u="' + esc(x.uid) + '"><td>' + esc(x.name) + '</td><td>' + esc(x.email) + '</td><td>' + esc(fTime(x.createdAt)) + '</td><td><button class="pri" data-act="approve">Approve</button> <button data-act="reject">Reject</button></td></tr>'; }).join('') : '<tr><td colspan="4" class="muted">No requests.</td></tr>') + '</tbody></table></div>';
  h += '<h3>Members (' + mem.length + ')</h3><div class="tw"><table><thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Approved by</th><th></th></tr></thead><tbody>' +
    mem.map(function (x) { var me = x.uid === ME.user.uid; return '<tr data-u="' + esc(x.uid) + '"><td>' + esc(x.name) + (me ? ' <span class="tag s">you</span>' : '') + '</td><td>' + esc(x.email) + '</td><td>' + (x.role === 'admin' ? 'Admin' : 'Member') + '</td><td class="small muted">' + esc(x.approvedBy || '') + '</td><td>' +
      (me ? '<span class="small muted">–</span>' : (x.role === 'admin' ? '<button data-act="demote">Make member</button>' : '<button data-act="promote">Make admin</button>') + ' <button class="danger" data-act="remove">Remove</button>') + '</td></tr>'; }).join('') + '</tbody></table></div>';
  m.innerHTML = h;
  $$('button[data-act]', m).forEach(function (b) { b.onclick = function () { memberAction(b.dataset.act, b.closest('tr').dataset.u); }; });
}
function memberAction(act, u) {
  var x = (APP.members || []).filter(function (y) { return y.uid === u; })[0]; if (!x) return;
  function done(p, msg) { p.then(function () { toast(msg); }).catch(writeErr); }
  if (act === 'approve') { done(B.updateMember(u, { approved: true }, who()), esc(x.name) + ' approved'); return; }
  var t = { reject: ['Reject request?', 'Reject the access request from <b>' + esc(x.name) + '</b>? They will not see any farm data. They can ask again later.', 'Reject'],
    remove: ['Remove member?', 'Remove <b>' + esc(x.name) + '</b>? They immediately lose access to all farm records. Records they entered stay.', 'Remove'],
    demote: ['Make member?', '<b>' + esc(x.name) + '</b> will no longer be able to approve or remove members.', 'Make member'],
    promote: ['Make admin?', '<b>' + esc(x.name) + '</b> will be able to approve, remove and promote members, upload backups and delete all records.', 'Make admin'] }[act];
  dlg({ title: t[0], html: '<p>' + t[1] + '</p>', buttons: [{ t: 'Cancel', v: false }, { t: t[2], v: true, cls: act === 'promote' ? 'pri' : 'danger' }] }).then(function (ok) {
    if (!ok) return;
    if (act === 'reject' || act === 'remove') done(B.deleteMember(u), esc(x.name) + (act === 'reject' ? ' rejected' : ' removed'));
    else done(B.updateMember(u, { role: act === 'promote' ? 'admin' : 'member' }, who()), 'Role changed');
  });
}

/* ---------- sign-in screens ---------- */
function authErr(e) {
  var c = (e && e.code) || '';
  return { 'auth/invalid-credential': 'Email or password is wrong.', 'auth/wrong-password': 'Email or password is wrong.', 'auth/user-not-found': 'Email or password is wrong.', 'auth/invalid-login-credentials': 'Email or password is wrong.',
    'auth/email-already-in-use': 'There is already an account with this email – sign in instead.', 'auth/weak-password': 'Choose a longer password (at least 8 characters).', 'auth/invalid-email': 'That email address doesn’t look right.',
    'auth/too-many-requests': 'Too many attempts – wait a few minutes and try again.', 'auth/network-request-failed': 'No signal – try again when you are online.', 'auth/missing-password': 'Enter your password.' }[c] || ((e && e.message) || 'Something went wrong.');
}
function show(screen, msg) { APP.screen = screen; APP.msg = msg || ''; paintAuth(); }
function paintAuth() {
  var inApp = APP.screen === 'app';
  document.body.classList.toggle('signedout', !inApp);
  var a = $('#auth'); a.hidden = inApp;
  if (inApp) { a.innerHTML = ''; render(); return; }
  $('#main').innerHTML = ''; $('#banners').innerHTML = '';
  var sc = APP.screen, h = '<div class="authbox"><div class="brand big"><span class="logo">🐄</span><div><b>Donegal Farm</b><small>Herd Tracker ' + APP_VERSION + '</small></div></div>';
  var msg = APP.msg ? '<div class="warns">' + esc(APP.msg) + '</div>' : '<div class="warns"></div>';
  if (sc === 'loading') h += '<p>Connecting…</p>';
  else if (sc === 'config') h += '<p>This copy of the app is not connected to the farm database yet (FIREBASE_CONFIG is not filled in).</p>';
  else if (sc === 'error') h += '<p>Couldn’t load the sign-in system. Check that you have signal, then reload.</p>' + msg + '<button id="aReload" class="pri">Reload</button>';
  else if (sc === 'signin') h += '<h2>Sign in</h2><form id="aForm" autocomplete="on"><label class="f"><span>Email</span><input id="aEmail" type="email" autocomplete="username" required></label><label class="f"><span>Password</span><input id="aPw" type="password" autocomplete="current-password" required></label>' + msg + '<button class="pri" type="submit">Sign in</button></form><p class="row"><button class="link" id="aToReg">Create an account</button><button class="link" id="aToReset">Forgot password?</button></p><p class="small muted">Only family members approved by an admin can see the farm records.</p>';
  else if (sc === 'register') h += '<h2>Create an account</h2><form id="aForm"><label class="f"><span>Your name</span><input id="aName" autocomplete="name" maxlength="60" required></label><label class="f"><span>Email</span><input id="aEmail" type="email" autocomplete="username" required></label><label class="f"><span>Password <i class="muted">at least 8 characters</i></span><input id="aPw" type="password" autocomplete="new-password" required></label><label class="f"><span>Password again</span><input id="aPw2" type="password" autocomplete="new-password" required></label>' + msg + '<button class="pri" type="submit">Create account &amp; ask for access</button></form><p><button class="link" id="aToIn">Back to sign in</button></p><p class="small muted">An admin has to approve you before you can see any farm records. Don’t use an ID or cell number as your name.</p>';
  else if (sc === 'reset') h += '<h2>Reset password</h2><form id="aForm"><label class="f"><span>Email</span><input id="aEmail" type="email" autocomplete="username" required></label>' + msg + '<button class="pri" type="submit">Send reset link</button></form><p><button class="link" id="aToIn">Back to sign in</button></p>';
  else if (sc === 'waiting') {
    var nm = (ME.member && ME.member.name) || (ME.user && ME.user.name) || '';
    if (ME.member) h += '<h2>Waiting for approval</h2><p>Thanks' + (nm ? ', <b>' + esc(nm) + '</b>' : '') + '. Your request has been sent. An admin (Gideon) needs to approve it before you can see the farm records.</p><p class="small muted">This page opens by itself as soon as you are approved – you can leave it open or come back later.</p>' + msg;
    else h += '<h2>No access yet</h2><p>There is no access request for this account (it may still be sending, or it was declined or removed).</p><form id="aForm"><label class="f"><span>Your name</span><input id="aName" maxlength="60" value="' + esc(nm) + '" required></label>' + msg + '<button class="pri" type="submit">Ask for access</button></form>';
    h += '<p><button id="aOut">Sign out</button></p>';
  }
  a.innerHTML = h + '</div>';
  function on(id, f) { var el = $('#' + id); if (el) el.onclick = function (e) { e.preventDefault(); f(); }; }
  on('aToReg', function () { show('register'); }); on('aToReset', function () { show('reset'); }); on('aToIn', function () { show('signin'); });
  on('aReload', function () { location.reload(); }); on('aOut', signOutFlow);
  var f = $('#aForm'); if (f) f.onsubmit = function (e) { e.preventDefault(); authSubmit(sc, f); };
}
function authSubmit(sc, f) {
  var v = function (id) { var el = $('#' + id); return el ? el.value.trim() : ''; }, btn = $('button[type=submit]', f);
  function fail(e) { btn.disabled = false; APP.msg = typeof e === 'string' ? e : authErr(e); var w = $('.warns', f); if (w) w.textContent = APP.msg; }
  btn.disabled = true;
  if (sc === 'signin') { B.signIn(v('aEmail'), $('#aPw').value).catch(fail); return; }
  if (sc === 'reset') { B.reset(v('aEmail')).then(function () { show('signin', 'If an account exists for that email, a reset link is on its way. Check your inbox (and spam).'); }).catch(function (e) { if (e && e.code === 'auth/user-not-found') show('signin', 'If an account exists for that email, a reset link is on its way.'); else fail(e); }); return; }
  var name = v('aName');
  if (!name) return fail('Enter your name.');
  if (C.looksLikePII(name)) return fail('Your name looks like it contains an ID or cell number – please use just your name.');
  if (sc === 'register') {
    if ($('#aPw').value.length < 8) return fail('Choose a password of at least 8 characters.');
    if ($('#aPw').value !== $('#aPw2').value) return fail('The two passwords are not the same.');
    APP.registering = true;
    B.register(name, v('aEmail'), $('#aPw').value).then(function () { APP.registering = false; }).catch(function (e) { APP.registering = false; if (APP.screen === 'register') fail(e); else show('waiting', authErr(e)); });
    return;
  }
  if (sc === 'waiting') B.requestAccess(name).catch(fail);
}
function signOutFlow() {
  var p = syncInfo().pend;
  dlg({ title: 'Sign out?', html: (p ? '<p class="warns">⚠ ' + p + ' change(s) have not reached the farm database yet (no signal). Signing out now will lose them – wait until you have signal.</p>' : '') + '<p>Signing out also removes the offline copy of the farm records from this device.</p>',
    buttons: [{ t: 'Cancel', v: false }, { t: 'Sign out', v: true, cls: p ? 'danger' : 'pri' }] }).then(function (ok) {
    if (!ok) return;
    stopAll(); U.lastSynced = null; U.tab = 'dash'; saveUI();
    B.signOut().catch(function () {}).then(function () { location.reload(); });
  });
}

/* ---------- auth state → screens ---------- */
var stopMe = null;
function resetCloud() { KEYS.forEach(function (k) { CLOUD[k] = {}; }); CLOUD.settings = null; CLOUD.loaded = {}; SYNC.fromCache = {}; SYNC.pending = {}; rebuild(); }
function stopAll() { if (stopFarm) { stopFarm(); stopFarm = null; } if (APP.stopMembers) { APP.stopMembers(); APP.stopMembers = null; } APP.members = null; resetCloud(); }
function onUser(u) {
  if (stopMe) { stopMe(); stopMe = null; }
  if (!u) { ME.user = null; ME.member = null; stopAll(); if (APP.screen !== 'register' && APP.screen !== 'reset') show('signin', APP.screen === 'signin' ? APP.msg : ''); return; }
  ME.user = u; show('loading');
  stopMe = B.watchMember(u.uid, function (m) {
    ME.member = m;
    if (m && m.approved) {
      startFarm();
      if (isAdmin() && !APP.stopMembers) APP.stopMembers = B.watchMembers(function (l) { APP.members = l; if (APP.screen === 'app') render(); }, function () { APP.members = []; });
      if (!isAdmin() && APP.stopMembers) { APP.stopMembers(); APP.stopMembers = null; APP.members = null; }
      if (APP.screen !== 'app') show('app'); else render();
    } else {
      stopAll();
      if (!m && APP.registering) show('waiting', 'Sending your request…'); else show('waiting');
    }
  }, function (e) { stopAll(); show('waiting', e && e.code === 'permission-denied' ? '' : authErr(e)); });
}
function startFarm() {
  if (stopFarm) return;
  var byColl = {}; KEYS.forEach(function (k) { byColl[COLL[k]] = k; });
  stopFarm = B.watchFarm(KEYS.map(function (k) { return COLL[k]; }).concat(['settings']), function (c, ch) {
    ch.forEach(function (x) {
      if (c === 'settings') { if (x.id === 'main') CLOUD.settings = x.type === 'removed' ? null : x.data; return; }
      var k = byColl[c]; if (x.type === 'removed') delete CLOUD[k][x.id]; else { x.data.id = x.id; CLOUD[k][x.id] = x.data; }
    });
    scheduleRender();
  }, function (c, fromCache, pend) { var was = allLoaded(); onMeta(c, fromCache, pend); if (!was && allLoaded()) scheduleRender(); },
  function (c, e) { SYNC.err = e && e.code === 'permission-denied' ? 'Access refused' : ((e && e.message) || 'error'); paintStatus(); });
  /* no signal at all: after a few seconds show what is in the offline copy */
  setTimeout(function () { if (!allLoaded()) { KEYS.forEach(function (k) { CLOUD.loaded[COLL[k]] = true; }); scheduleRender(); } }, navigator.onLine ? 8000 : 1500);
}

/* ---------- start ---------- */
function registerSW(cfg) {
  if (!('serviceWorker' in navigator) || !(location.protocol === 'https:' || location.hostname === 'localhost') || cfg.emulator || window.DF_BACKEND) return;
  navigator.serviceWorker.register('./sw.js', { scope: './', updateViaCache: 'none' }).catch(function () {});
}
function boot() {
  loadUI(); rebuild();
  $$('#tabs button').forEach(function (b) { b.onclick = function () { U.tab = b.dataset.t; render(); window.scrollTo(0, 0); }; });
  $('#syncChip').onclick = function () { U.tab = 'setup'; render(); };
  window.addEventListener('online', paintStatus); window.addEventListener('offline', paintStatus);
  var cfg = window.DF_TEST_CONFIG || window.FIREBASE_CONFIG || {};
  var mk = window.DF_BACKEND ? Promise.resolve(window.DF_BACKEND()) : dfConfigured(cfg) ? dfFirebaseBackend(cfg) : null;
  if (!mk) { show('config'); return; }
  show('loading');
  registerSW(cfg);
  mk.then(function (b) { B = b; B.onAuth(onUser); }).catch(function (e) { show('error', (e && e.message) || String(e)); });
}
boot();

</script>
</body>
